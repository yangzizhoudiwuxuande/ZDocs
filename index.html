<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ZDocs</title>
<style>
  :root { 
    --sidebar-width: 280px; --toc-width: 240px; --top-nav-height: 60px;
    --bg: #ffffff; --text: #334155; --text-title: #0f172a; 
    --border: #e2e8f0; --primary: #3b82f6; 
    --sidebar-bg: #f8fafc; --hover-bg: #f1f5f9; 
    --active-bg: #e0f2fe; --code-bg: #f1f5f9; --code-text: #eb5757;
    --pre-bg: #1e1e2e; --pre-text: #cdd6f4;
    --tip-bg: #e8f8f5; --tip-border: #2ecc71; --tip-text: #1e8e3e;
    --warn-bg: #fff9e6; --warn-border: #f1c40f; --warn-text: #8a6d3b;
    --api-bg: #282c34; --api-text: #abb2bf;
    --details-bg: #f8fafc; --mark-bg: #fef08a; --mark-text: inherit;
    --table-stripe: #f8fafc;
  }
  [data-theme="dark"] {
    --bg: #0f172a; --text: #cbd5e1; --text-title: #f8fafc; 
    --border: #334155; --primary: #60a5fa; 
    --sidebar-bg: #1e293b; --hover-bg: #334155; 
    --active-bg: rgba(96, 165, 250, 0.15); --code-bg: #1e293b; --code-text: #f38ba8;
    --pre-bg: #020617; --pre-text: #e2e8f0;
    --tip-bg: rgba(46, 204, 113, 0.1); --tip-border: #2ecc71; --tip-text: #a6e3a1;
    --warn-bg: rgba(241, 196, 15, 0.1); --warn-border: #f1c40f; --warn-text: #f9e2af;
    --api-bg: #1e293b; --api-text: #cbd5e1;
    --details-bg: #1e293b; --mark-bg: #ca8a04; --mark-text: #fff;
    --table-stripe: #1e293b;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, sans-serif; color: var(--text); background: var(--bg); display: flex; flex-direction: column; min-height: 100vh; transition: background 0.3s; }

  /* 顶部导航栏 */
  .top-navbar { height: var(--top-nav-height); background: var(--bg); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; position: fixed; top: 0; left: 0; right: 0; z-index: 1000; transition: background 0.3s, border 0.3s; }
  .nav-left { display: flex; align-items: center; gap: 16px; font-weight: bold; font-size: 1.1rem; color: var(--text-title); }
  .nav-right { display: flex; align-items: center; gap: 16px; }
  .nav-link { color: var(--text); text-decoration: none; font-size: 0.9rem; font-weight: 500; cursor: pointer; }
  .nav-link:hover { color: var(--primary); }
  .theme-toggle { background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--text); }
  .lang-select { border: 1px solid var(--border); background: var(--bg); color: var(--text); border-radius: 4px; padding: 4px 8px; outline: none; font-size: 0.85rem; cursor: pointer; }

  /* 页面布局 */
  .layout-container { display: flex; margin-top: var(--top-nav-height); flex: 1; }

  /* 侧边栏 */
  .sidebar { width: var(--sidebar-width); background: var(--sidebar-bg); border-right: 1px solid var(--border); position: fixed; top: var(--top-nav-height); bottom: 0; left: 0; padding: 24px 16px; overflow-y: auto; transition: background 0.3s; }
  .nav-group { margin-bottom: 8px; }
  .nav-folder { display: flex; align-items: center; padding: 8px 12px; font-size: 0.9rem; font-weight: 600; color: var(--text-title); cursor: pointer; border-radius: 6px; }
  .nav-folder:hover { background: var(--hover-bg); }
  .folder-arrow { display: inline-block; width: 16px; font-size: 0.75rem; transition: transform 0.2s; text-align: center; margin-right: 6px; color: #64748b; }
  .nav-group.open .folder-arrow { transform: rotate(90deg); }
  .nav-children { display: none; margin-top: 4px; padding-left: 12px; border-left: 1px solid var(--border); margin-left: 16px; }
  .nav-group.open .nav-children { display: block; }
  .nav-item { display: block; padding: 6px 12px; color: var(--text); text-decoration: none; font-size: 0.88rem; border-radius: 6px; margin-bottom: 2px; cursor: pointer; transition: all 0.2s; }
  .nav-item:hover { background: var(--hover-bg); }
  .nav-item.active { background: var(--active-bg); color: var(--primary); font-weight: 600; }

  /* 主内容区 */
  .main-wrapper { margin-left: var(--sidebar-width); margin-right: var(--toc-width); flex: 1; padding: 32px 48px; max-width: 900px; }
  
  .breadcrumbs { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: #64748b; margin-bottom: 24px; }
  .breadcrumbs a { color: var(--primary); text-decoration: none; }
  .breadcrumbs a:hover { text-decoration: underline; }
  .breadcrumbs span { color: #94a3b8; }

  /* 正文标题样式与悬浮锚点 */
  .doc-body h1, .doc-body h2, .doc-body h3, .doc-body h4 { position: relative; color: var(--text-title); margin-bottom: 16px; scroll-margin-top: 80px; }
  .doc-body h1 { font-size: 2.2rem; border-bottom: 1px solid var(--border); padding-bottom: 16px; }
  .doc-body h2 { font-size: 1.5rem; margin-top: 36px; }
  .doc-body h3 { font-size: 1.2rem; margin-top: 24px; }
  .doc-body h4 { font-size: 1rem; margin-top: 20px; }

  /* 鼠标悬浮在标题上时，左侧出现的 # 锚点 */
  .doc-body h1 .anchor, .doc-body h2 .anchor, .doc-body h3 .anchor, .doc-body h4 .anchor {
    opacity: 0; position: absolute; left: -24px; top: 50%; transform: translateY(-50%);
    color: var(--primary); text-decoration: none; font-weight: normal; transition: opacity 0.2s;
  }
  .doc-body h1:hover .anchor, .doc-body h2:hover .anchor, .doc-body h3:hover .anchor, .doc-body h4:hover .anchor { opacity: 1; }

  .doc-body p { line-height: 1.8; margin-bottom: 16px; }
  .doc-body code { background: var(--code-bg); padding: 2px 6px; border-radius: 4px; color: var(--code-text); font-family: 'SF Mono', monospace; font-size: 0.9em; }
  .doc-body pre { background: var(--pre-bg); color: var(--pre-text); padding: 16px; border-radius: 8px; overflow-x: auto; margin: 20px 0; border: 1px solid var(--border); }
  .doc-body pre code { background: transparent; color: inherit; padding: 0; }
  .doc-body ul { padding-left: 20px; margin-bottom: 16px; line-height: 1.8; }
  
  .doc-body table { border-collapse: collapse; width: 100%; margin: 24px 0; font-size: 0.95em; }
  .doc-body th, .doc-body td { border: 1px solid var(--border); padding: 10px 14px; text-align: left; vertical-align: top; }
  .doc-body th { background-color: var(--sidebar-bg); color: var(--text-title); font-weight: 600; }
  .doc-body tr:nth-child(even) { background-color: var(--table-stripe); }
  
  .zdoc-admonition { padding: 16px; border-left: 4px solid; border-radius: 6px; margin: 24px 0; }
  .zdoc-admonition strong { display: block; margin-bottom: 6px; }
  .zdoc-tip { background: var(--tip-bg); border-color: var(--tip-border); color: var(--tip-text); }
  .zdoc-warning { background: var(--warn-bg); border-color: var(--warn-border); color: var(--warn-text); }
  .zdoc-api { background: var(--api-bg); color: var(--api-text); padding: 16px; border-radius: 8px; margin: 24px 0; }
  .zdoc-api-method { background: var(--primary); color: #fff; padding: 2px 8px; border-radius: 4px; font-weight: bold; margin-right: 10px; }
  .zdoc-details { border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin: 24px 0; background: var(--details-bg); }
  .zdoc-code-group { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin: 24px 0; }
  .zdoc-cg-header { background: var(--sidebar-bg); padding: 10px 16px; border-bottom: 1px solid var(--border); font-size: 0.85rem; }

  /* 右侧目录 */
  .toc { width: var(--toc-width); position: fixed; top: var(--top-nav-height); bottom: 0; right: 0; padding: 32px 20px; overflow-y: auto; }
  .toc-title { font-size: 0.8rem; font-weight: 600; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; }
  .toc-list { list-style: none; border-left: 1px solid var(--border); }
  .toc-list a { display: block; padding: 4px 16px; color: #64748b; text-decoration: none; font-size: 0.85rem; border-left: 2px solid transparent; margin-left: -1px; transition: all 0.2s; cursor: pointer; }
  .toc-list a:hover { color: var(--primary); }
  .toc-list a.active { color: var(--primary); border-left-color: var(--primary); font-weight: 500; }
  .toc-list .toc-h3 { padding-left: 32px; }
  .toc-list .toc-h4 { padding-left: 48px; font-size: 0.8rem; }

  /* 底部翻页 */
  .doc-footer { margin-top: 60px; padding-top: 24px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; gap: 16px; }
  .nav-btn { flex: 1; display: flex; flex-direction: column; padding: 16px; border: 1px solid var(--border); border-radius: 8px; background: transparent; color: var(--text); font-family: inherit; font-size: inherit; cursor: pointer; text-align: left; touch-action: manipulation; transition: all 0.3s; }
  .nav-btn:hover { border-color: var(--primary); background: var(--hover-bg); }
  .nav-btn.next { text-align: right; }
  .nav-btn.empty { visibility: hidden; pointer-events: none; }
  .nav-btn * { pointer-events: none; }
  .nav-btn .nav-label { font-size: 0.8rem; color: #94a3b8; margin-bottom: 4px; }
  .nav-btn .nav-title { font-weight: 600; color: var(--primary); font-size: 0.95rem; }
  
  @media (max-width: 900px) { 
    .sidebar { display: none; }
    .toc { display: none; }
    .main-wrapper { margin-left: 0; margin-right: 0; padding: 20px; }
    .top-navbar { padding: 0 16px; }
  }
</style>
</head>
<body>

<header class="top-navbar">
  <div class="nav-left">
    <span>📚 ZDocs</span>
  </div>
  <div class="nav-right">
    <a href="https://github.com/yangzizhoudiwuxuande/ZDocs" target="_blank" class="nav-link">GitHub</a>
    <select id="lang-select" class="lang-select" onchange="changeLanguage(this.value)">
      <option value="zh-CN">简体中文</option>
      <option value="zh-TW">繁體中文</option>
      <option value="en">English</option>
      <option value="fr">Français</option>
      <option value="de">Deutsch</option>
      <option value="ru">Русский</option>
      <option value="es">Español</option>
    </select>
    <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
  </div>
</header>

<div class="layout-container">
  <aside class="sidebar" id="sidebar">
    <div id="sidebar-nav"><div style="color: #94a3b8; font-size: 0.9rem;">加载中...</div></div>
  </aside>

  <main class="main-wrapper">
    <div class="breadcrumbs" id="breadcrumbs"></div>
    <div id="doc-content" class="doc-body"></div>
    <div class="doc-footer" id="doc-footer"></div>
  </main>

  <aside class="toc">
    <div class="toc-title">本页目录</div>
    <ul class="toc-list" id="toc-list"></ul>
  </aside>
</div>

<script>
const uiTexts = {
  'zh-CN': { toc: '本页目录', prev: '← 上一篇', next: '下一篇 →', noDocs: '暂无文档', welcomeTitle: '欢迎使用 ZDocs', welcomeText: '你的文件列表是空的。' },
  'en': { toc: 'On This Page', prev: '← Previous', next: 'Next →', noDocs: 'No documents', welcomeTitle: 'Welcome to ZDocs', welcomeText: 'Your document list is empty.' }
};

let currentLang = localStorage.getItem('zdocs-lang') || 'zh-CN';

function updateUI() {
  const texts = uiTexts[currentLang] || uiTexts['zh-CN'];
  document.querySelector('.toc-title').textContent = texts.toc;
  document.getElementById('lang-select').value = currentLang;
}

function initTheme() {
  const savedTheme = localStorage.getItem('zdocs-theme') || 'light';
  document.documentElement.setAttribute('data-theme', savedTheme);
  updateThemeIcon(savedTheme);
}
function toggleTheme() {
  const currentTheme = document.documentElement.getAttribute('data-theme');
  const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', newTheme);
  localStorage.setItem('zdocs-theme', newTheme);
  updateThemeIcon(newTheme);
}
function updateThemeIcon(theme) {
  document.querySelectorAll('.theme-toggle').forEach(btn => { btn.textContent = theme === 'dark' ? '☀️' : '🌙'; });
}
initTheme();

function escapeText(text) { return text.replace(/\^([\/\\?~\-*$|!<\[\]_])/g, (m, p1) => `\x00ESC_${p1.charCodeAt(0)}\x00`); }
function unescapeText(text) { return text.replace(/\x00ESC_(\d+)\x00/g, (m, p1) => String.fromCharCode(parseInt(p1, 10))); }
function parseInline(text) {
  let res = escapeText(text);
  res = res.replace(/\?(.*?)\?/g, '<strong>$1</strong>');
  res = res.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
  res = res.replace(/\\(.*?)\\/g, '<i>$1</i>');
  res = res.replace(/_(.*?)_/g, '<u>$1</u>');
  res = res.replace(/-(.*?)-/g, '<del>$1</del>');
  res = res.replace(/~(.*?)~/g, '<code>$1</code>');
  res = res.replace(/\*(.*?)\*\((.*?)\)/g, (match, text, url) => {
    if (url.endsWith('.zdoc')) return `<a href="javascript:void(0)" data-zdoc="${url}" class="internal-link">${text}</a>`;
    return `<a href="${url}" target="_blank" rel="noopener noreferrer">${text}</a>`;
  });
  return unescapeText(res);
}

function renderZDocs(text) {
  let body = text.replace(/\r\n/g, '\n'); let html = []; let lines = body.split('\n'); let i = 0;
  if (lines[0] && lines[0].trim() === '---') { i = 1; while (i < lines.length && lines[i].trim() !== '---') i++; if (i < lines.length) i++; }
  
  while (i < lines.length) {
    let line = lines[i];
    
    let match = line.match(/^:::\s*([\w-]+)(.*)$/);
    if (match) {
      let type = match[1]; let argsStr = match[2].trim(); let label = '', arg = argsStr;
      let lm = argsStr.match(/\[(.*?)\]/); if (lm) { label = lm[1]; arg = argsStr.replace(lm[0], '').trim(); }
      let contentLines = [], inCodeBlock = false; i++;
      while (i < lines.length) {
        let currLine = lines[i].trim();
        if (currLine.startsWith('```') || currLine.startsWith('~')) inCodeBlock = !inCodeBlock;
        if (!inCodeBlock && currLine === ':::') break;
        contentLines.push(lines[i]); i++;
      }
      i++; let innerText = contentLines.join('\n');
      if (type === 'tip') html.push(`<div class="zdoc-admonition zdoc-tip"><strong>💡 提示</strong><p>${parseInline(innerText)}</p></div>`);
      else if (type === 'warning') html.push(`<div class="zdoc-admonition zdoc-warning"><strong>⚠️ 注意</strong><p>${parseInline(innerText)}</p></div>`);
      else if (type === 'api') html.push(`<div class="zdoc-api"><div class="zdoc-api-method">${arg}</div>${parseInline(innerText)}</div>`);
      else if (type === 'details') html.push(`<details class="zdoc-details"><summary>${arg}</summary><div style="margin-top:10px;">${parseInline(innerText)}</div></details>`);
      else if (type === 'code-group') {
        let cleanCode = innerText.replace(/^~[a-zA-Z0-9_]*$/gm, '').replace(/^```[a-zA-Z0-9_]*$/gm, '').replace(/^```$/gm, '').trim();
        html.push(`<div class="zdoc-code-group"><div class="zdoc-cg-header"><span>${label || 'Code'}</span></div><pre><code>${cleanCode}</code></pre></div>`);
      }
      continue;
    }

    if (line.trim().startsWith('|') && i + 1 < lines.length && /^-{3,}$/.test(lines[i+1].trim())) {
      let headers = line.split('|').slice(1, -1).map(s => s.trim());
      let htmlTable = ['<table><thead><tr>'];
      headers.forEach(h => htmlTable.push(`<th>${parseInline(h)}</th>`));
      htmlTable.push('</tr></thead><tbody>');
      i += 2;
      while (i < lines.length && lines[i].trim().startsWith('|')) {
        let row = lines[i].split('|').slice(1, -1).map(s => s.trim());
        htmlTable.push('<tr>');
        row.forEach(cell => htmlTable.push(`<td>${parseInline(cell)}</td>`));
        htmlTable.push('</tr>');
        i++;
      }
      htmlTable.push('</tbody></table>');
      html.push(htmlTable.join(''));
      continue;
    }

    // 修复：一、二、三、四级标题都生成 id，并加入 # 锚点
    if (line.startsWith('//// ')) { 
      let t = parseInline(line.substring(5)); 
      let id = 'h-' + t.replace(/\s+/g, '-').toLowerCase(); 
      html.push(`<h4 id="${id}"><a class="anchor" href="#${id}">#</a>${t}</h4>`); 
    }
    else if (line.startsWith('/// ')) { 
      let t = parseInline(line.substring(4)); 
      let id = 'h-' + t.replace(/\s+/g, '-').toLowerCase(); 
      html.push(`<h3 id="${id}"><a class="anchor" href="#${id}">#</a>${t}</h3>`); 
    }
    else if (line.startsWith('// ')) { 
      let t = parseInline(line.substring(3)); 
      let id = 'h-' + t.replace(/\s+/g, '-').toLowerCase(); 
      html.push(`<h2 id="${id}"><a class="anchor" href="#${id}">#</a>${t}</h2>`); 
    }
    else if (line.startsWith('/ ')) {
      let t = parseInline(line.substring(2)); 
      let id = 'h-' + t.replace(/\s+/g, '-').toLowerCase(); 
      html.push(`<h1 id="${id}"><a class="anchor" href="#${id}">#</a>${t}</h1>`); 
    }
    else if (line.startsWith('! ')) {
      let items = []; while (i < lines.length && lines[i].startsWith('! ')) { items.push(`<li>${parseInline(lines[i].substring(2))}</li>`); i++; }
      html.push(`<ul>${items.join('')}</ul>`); continue;
    }
    else if (line.trim().startsWith('~')) {
       let lang = line.trim().substring(1); let code = []; i++;
       while(i < lines.length && lines[i].trim() !== '~') { code.push(lines[i]); i++; }
       html.push(`<pre><code>${code.join('\n')}</code></pre>`);
    }
    else if (line.trim()) html.push(`<p>${parseInline(line)}</p>`);
    i++;
  }
  return html.join('\n');
}

const sidebarNav = document.getElementById('sidebar-nav');
const docContent = document.getElementById('doc-content');
const tocList = document.getElementById('toc-list');
const docFooter = document.getElementById('doc-footer');
const siteTitleEl = document.querySelector('.nav-left');
const breadcrumbsEl = document.getElementById('breadcrumbs');

let docsData = [];
let originalFileList = [];

async function changeLanguage(lang) {
  if (lang === currentLang) return;
  currentLang = lang;
  localStorage.setItem('zdocs-lang', lang);
  updateUI();
  await fetchDocs();
}

async function fetchDocContent(basePath) {
  if (currentLang !== 'zh-CN') {
    const ext = '.zdoc';
    const base = basePath.endsWith(ext) ? basePath.slice(0, -ext.length) : basePath;
    const langPath = `./docs/${base}.${currentLang}.zdoc`;
    try {
      const res = await fetch(langPath);
      if (res.ok) return await res.text();
    } catch(e) {}
  }
  const defaultRes = await fetch('./docs/' + basePath);
  if (!defaultRes.ok) throw new Error(`找不到 docs/${basePath}`);
  return await defaultRes.text();
}

async function fetchDocs() {
  try {
    try {
      const titleRes = await fetch('./title.html');
      if (titleRes.ok) {
        const titleText = await titleRes.text();
        const titleMatch = titleText.match(/const\s+siteTitle\s*=\s*["']([^"']+)["']/);
        if (titleMatch) siteTitleEl.innerHTML = `📚 ${titleMatch[1]}`;
      }
    } catch(e) { siteTitleEl.innerHTML = "📚 ZDocs"; }

    const res = await fetch('./files.html');
    if (!res.ok) throw new Error('缺少 files.html');
    const htmlText = await res.text();
    const match = htmlText.match(/const\s+myDocFiles\s*=\s*(\[[\s\S]*?\]);?/);
    if (!match) throw new Error('files.html 格式不对');
    
    try { originalFileList = new Function('return ' + match[1])(); } catch (err) { throw new Error('files.html 数组语法错误'); }

    if (!originalFileList || originalFileList.length === 0) {
      docContent.innerHTML = `<h1>欢迎使用 ZDocs</h1><p>文件列表为空。</p>`;
      return;
    }
    
    const promises = originalFileList.map(file => {
      return fetchDocContent(file).then(text => {
        let titleMatch = text.match(/title:\s*(.*)/);
        let title = titleMatch ? titleMatch[1].trim() : file.split('/').pop().replace('.zdoc', '');
        return { id: `doc-${file}`, title: title, content: text, path: file };
      });
    });
    docsData = await Promise.all(promises);

    renderSidebarTree();
    handleRoute();
    
  } catch (e) {
    sidebarNav.innerHTML = `<div style="color: red; font-size: 0.85rem;">报错：${e.message}</div>`;
  }
}

function renderSidebarTree() {
  sidebarNav.innerHTML = '';
  const tree = {};
  originalFileList.forEach((path, index) => {
    const parts = path.split('/');
    let current = tree;
    for (let i = 0; i < parts.length - 1; i++) {
      if (!current[parts[i]]) current[parts[i]] = { _isFolder: true, _children: {} };
      current = current[parts[i]]._children;
    }
    current[parts[parts.length - 1]] = { _isFolder: false, _index: index, _name: docsData[index].title };
  });

  function buildDOM(node, parentEl) {
    for (const key in node) {
      const item = node[key];
      if (item._isFolder) {
        const groupEl = document.createElement('div'); groupEl.className = 'nav-group open';
        const folderEl = document.createElement('div'); folderEl.className = 'nav-folder';
        folderEl.innerHTML = `<span class="folder-arrow">❯</span>${key}`;
        folderEl.onclick = () => groupEl.classList.toggle('open');
        const childrenEl = document.createElement('div'); childrenEl.className = 'nav-children';
        groupEl.appendChild(folderEl); groupEl.appendChild(childrenEl); parentEl.appendChild(groupEl);
        buildDOM(item._children, childrenEl);
      } else {
        const a = document.createElement('a'); a.className = 'nav-item';
        a.textContent = item._name; a.dataset.index = item._index;
        a.onclick = () => { navigateTo(item._index); };
        parentEl.appendChild(a);
      }
    }
  }
  buildDOM(tree, sidebarNav);
  updateActiveNav();
}

function updateActiveNav() {
  const hash = window.location.hash.replace('#/', '');
  document.querySelectorAll('.nav-item').forEach(el => {
    const doc = docsData[el.dataset.index];
    if (doc && decodeURIComponent(hash) === doc.path) el.classList.add('active');
    else el.classList.remove('active');
  });
}

function navigateTo(index) {
  const doc = docsData[index];
  if (doc) window.location.hash = '/' + encodeURIComponent(doc.path);
}

function handleRoute() {
  let hash = window.location.hash;
  
  // 如果只是页内锚点跳转 (#h-xxx)，不触发文档切换
  if (hash && !hash.startsWith('#/')) return;

  hash = hash.replace('#/', '');
  if (!hash) {
    if (docsData.length > 0) navigateTo(0);
    return;
  }

  hash = decodeURIComponent(hash);
  const targetIndex = docsData.findIndex(d => d.path === hash);

  if (targetIndex !== -1) {
    loadPageContent(targetIndex);
  } else {
    docContent.innerHTML = `<h1>404 Not Found</h1><p>找不到文档：${hash}</p>`;
  }
}

function loadPageContent(index) {
  const doc = docsData[index];
  if (!doc) return;
  
  updateActiveNav();
  docContent.innerHTML = renderZDocs(doc.content);
  
  // 更新面包屑
  const parts = doc.path.split('/');
  let crumbHtml = `<a href="javascript:void(0)" onclick="navigateTo(${index})">🏠</a>`;
  if (parts.length > 1) {
    for (let i = 0; i < parts.length - 1; i++) {
      crumbHtml += ` <span>/</span> <span>${parts[i]}</span>`;
    }
  }
  crumbHtml += ` <span>/</span> <span style="color:var(--text-title); font-weight:500;">${doc.title}</span>`;
  breadcrumbsEl.innerHTML = crumbHtml;

  // 内部链接拦截
  docContent.querySelectorAll('a.internal-link').forEach(a => {
    a.onclick = (e) => {
      e.preventDefault();
      const targetHref = a.getAttribute('data-zdoc');
      const targetIdx = docsData.findIndex(d => d.path.endsWith(targetHref));
      if (targetIdx !== -1) navigateTo(targetIdx);
      else alert(`找不到目标文档：${targetHref}`);
    };
  });
  
  // 更新 TOC (现在抓取 h2, h3, h4)
  tocList.innerHTML = '';
  docContent.querySelectorAll('h2, h3, h4').forEach(h => {
    const li = document.createElement('li');
    const a = document.createElement('a');
    // 点击目录时，平滑滚动且不改变路由状态
    a.href = 'javascript:void(0)';
    a.textContent = h.textContent.replace('#', '').trim();
    if (h.tagName === 'H3') a.className = 'toc-h3';
    if (h.tagName === 'H4') a.className = 'toc-h4';
    
    a.onclick = (e) => {
      e.preventDefault();
      h.scrollIntoView({ behavior: 'smooth' });
      document.querySelectorAll('.toc-list a').forEach(el => el.classList.remove('active'));
      a.classList.add('active');
    };
    li.appendChild(a);
    tocList.appendChild(li);
  });

  generateFooter(index);
  window.scrollTo(0, 0);
}

function generateFooter(index) {
  docFooter.innerHTML = '';
  const texts = uiTexts[currentLang] || uiTexts['zh-CN'];
  if (index > 0) {
    const prev = docsData[index - 1];
    const btn = document.createElement('button'); btn.className = 'nav-btn prev'; btn.dataset.target = index - 1;
    btn.innerHTML = `<span class="nav-label">${texts.prev}</span><span class="nav-title">${prev.title}</span>`;
    docFooter.appendChild(btn);
  } else { docFooter.appendChild(document.createElement('div')).className = 'nav-btn empty'; }
  
  if (index < docsData.length - 1) {
    const next = docsData[index + 1];
    const btn = document.createElement('button'); btn.className = 'nav-btn next'; btn.dataset.target = index + 1;
    btn.innerHTML = `<span class="nav-label">${texts.next}</span><span class="nav-title">${next.title}</span>`;
    docFooter.appendChild(btn);
  } else { docFooter.appendChild(document.createElement('div')).className = 'nav-btn empty'; }
}

docFooter.addEventListener('click', function(e) {
  const btn = e.target.closest('.nav-btn');
  if (btn && btn.dataset.target !== undefined) navigateTo(parseInt(btn.dataset.target, 10));
});

window.addEventListener('hashchange', handleRoute);

updateUI();
fetchDocs();
</script>
</body>
</html>
